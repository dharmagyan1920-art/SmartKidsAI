name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project (repo root or ZIP)
        run: |
          set -eu
          ROOT=""
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="$GITHUB_WORKSPACE"
            echo "Project found in repository root."
          else
            ZIP="SmartKidsAI-fixed.zip"
            if [ ! -f "$ZIP" ]; then
              ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            fi
            if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
              echo "ERROR: no settings.gradle(.kts) and no ZIP file found."
              ls -la
              exit 1
            fi
            echo "Using ZIP: $ZIP"
            unzip -tq "$ZIP"
            if unzip -Z1 "$ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "ERROR: ZIP contains unsafe paths. Refusing to extract."
              exit 1
            fi
            DEST="$RUNNER_TEMP/project"
            mkdir -p "$DEST"
            unzip -q "$ZIP" -d "$DEST" -x '__MACOSX/*'
            echo "ZIP contents (first 80 entries):"
            unzip -Z1 "$ZIP" | head -n 80
            SETTINGS=$(find "$DEST" -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
            if [ -z "$SETTINGS" ]; then
              echo "ERROR: no settings.gradle(.kts) inside the ZIP."
              find "$DEST" -maxdepth 4 | head -n 100
              exit 1
            fi
            ROOT=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project directory: $ROOT"

      - name: Inspect project and choose Gradle version
        run: |
          set -eu
          cd "$PROJECT_DIR"
          echo "--- top level ---"
          ls -la
          echo "--- gradle wrapper ---"
          if [ -f gradlew ]; then echo "gradlew: present"; else echo "gradlew: MISSING"; fi
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "gradle-wrapper.properties: MISSING"
          fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then echo "wrapper jar: present"; else echo "wrapper jar: MISSING"; fi
          echo "--- modules ---"
          find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './build/*'
          AGP=""
          if [ -f gradle/libs.versions.toml ]; then
            AGP=$(grep -E '^agp[[:space:]]*=' gradle/libs.versions.toml | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)
          fi
          if [ -z "$AGP" ]; then
            AGP=$(grep -rhE "com\.android\.(application|tools\.build:gradle)" --include=build.gradle --include=build.gradle.kts --include=settings.gradle --include=settings.gradle.kts . | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          fi
          echo "Detected AGP version: ${AGP:-unknown}"
          MM=$(echo "$AGP" | cut -d. -f1,2)
          case "$MM" in
            7.0|7.1) G=7.2 ;;
            7.2) G=7.3.3 ;;
            7.3) G=7.4.2 ;;
            7.4) G=7.5 ;;
            8.0|8.1) G=8.0 ;;
            8.2) G=8.2 ;;
            8.3) G=8.4 ;;
            8.4) G=8.6 ;;
            8.5|8.6) G=8.7 ;;
            8.7) G=8.9 ;;
            8.8) G=8.10.2 ;;
            8.9|8.10) G=8.11.1 ;;
            8.11|8.12|8.13) G=8.13 ;;
            *) G=8.7; echo "WARNING: AGP version unknown or unmapped, defaulting to Gradle $G" ;;
          esac
          echo "Compatible Gradle version: $G"
          echo "GRADLE_VERSION=$G" >> "$GITHUB_ENV"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "NEED_WRAPPER=false" >> "$GITHUB_ENV"
          else
            echo "NEED_WRAPPER=true" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use preinstalled Android SDK and accept licenses
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK folder not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK: $SDK"
          ls "$SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK" --licenses > "$RUNNER_TEMP/licenses.log" 2>&1 || true
            tail -n 5 "$RUNNER_TEMP/licenses.log"
          else
            echo "WARNING: sdkmanager not found at $SDKMGR"
          fi

      - name: Set up Gradle (only when wrapper is missing)
        if: env.NEED_WRAPPER == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper (only when missing)
        if: env.NEED_WRAPPER == 'true'
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          ls -la gradlew gradle/wrapper

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          ./gradlew testDebugUnitTest --stacktrace

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR" || exit 0
          ls -la
          java -version 2>&1 || true
          ./gradlew --version 2>&1 || true
          find . -path '*/build/reports' -maxdepth 5 | head -n 20

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKidsAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
