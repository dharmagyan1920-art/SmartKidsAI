- name: Extract Android project
  run: |
    mkdir -p extracted
    ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

    if [ -z "$ZIP_FILE" ]; then
      echo "ERROR: ZIP file not found in repository"
      ls -la
      exit 1
    fi

    echo "Found ZIP: $ZIP_FILE"
    unzip -o "$ZIP_FILE" -d extracted
