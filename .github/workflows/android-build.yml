      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(
            find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
