name: Build SmartKidsAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew file is missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKidsAI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
