name: Build SmartKidsAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            ! -path "./extracted/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android ZIP found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            ! -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_URL=$(grep '^distributionUrl=' \
              "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
              | head -n 1 \
              | cut -d= -f2- \
              | sed 's/\\:/:/g')

            GRADLE_VERSION=$(echo "$GRADLE_URL" \
              | grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?(-[^/]+)?-bin.zip' \
              | head -n 1 \
              | sed -E 's/^gradle-//; s/-bin\.zip$//')

            if [ -z "$GRADLE_VERSION" ]; then
              echo "ERROR: Could not determine Gradle version"
              exit 1
            fi
          else
            echo "ERROR: Gradle wrapper properties missing"
            exit 1
          fi

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo "Required Gradle version: $GRADLE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building SmartKidsAI APK..."

          gradle --version

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKidsAI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
